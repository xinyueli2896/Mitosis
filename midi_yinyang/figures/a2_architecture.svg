<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 470" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="A.2 duet block-diffusion architecture: interleaved two-stream representation, block-diffusion training step, and seeded refinement decoding">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3565b0"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c96a1e"/>
    </marker>
  </defs>

  <!-- ============ panel separators ============ -->
  <line x1="392" y1="18" x2="392" y2="452" stroke="#ddd" stroke-width="1"/>
  <line x1="856" y1="18" x2="856" y2="452" stroke="#ddd" stroke-width="1"/>

  <!-- ================= PANEL (a) ================= -->
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#111">(a) Interleaved duet representation</text>

  <!-- melody stream -->
  <text x="20" y="66" font-size="11" fill="#3565b0" font-weight="bold">melody</text>
  <g>
    <rect x="78"  y="52" width="26" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="110" y="52" width="26" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="142" y="52" width="26" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="174" y="52" width="26" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <text x="91"  y="66" font-size="10" fill="#26497f" text-anchor="middle">m0</text>
    <text x="123" y="66" font-size="10" fill="#26497f" text-anchor="middle">m1</text>
    <text x="155" y="66" font-size="10" fill="#26497f" text-anchor="middle">m2</text>
    <text x="187" y="66" font-size="10" fill="#26497f" text-anchor="middle">m3</text>
  </g>
  <!-- chord stream, sparse -->
  <text x="20" y="104" font-size="11" fill="#c96a1e" font-weight="bold">chord</text>
  <g>
    <rect x="78"  y="90" width="26" height="20" rx="3" fill="#f6ddc4" stroke="#c96a1e"/>
    <rect x="110" y="90" width="26" height="20" rx="3" fill="none" stroke="#c96a1e" stroke-dasharray="3 3"/>
    <rect x="142" y="90" width="26" height="20" rx="3" fill="none" stroke="#c96a1e" stroke-dasharray="3 3"/>
    <rect x="174" y="90" width="26" height="20" rx="3" fill="#f6ddc4" stroke="#c96a1e"/>
    <text x="91"  y="104" font-size="10" fill="#8a4310" text-anchor="middle">c0</text>
            <text x="187" y="104" font-size="10" fill="#8a4310" text-anchor="middle">c3</text>
  </g>
  <text x="230" y="86" font-size="10" fill="#666">one frame per</text>
  <text x="230" y="98" font-size="10" fill="#666">16th-note step,</text>
  <text x="230" y="110" font-size="10" fill="#666">per stream</text>

  <!-- zoom: one frame -> CP tokens -> local encoder -> embedding -->
  <line x1="91" y1="72" x2="60" y2="150" stroke="#999" stroke-width="0.8"/>
  <line x1="104" y1="72" x2="180" y2="150" stroke="#999" stroke-width="0.8"/>
  <g>
    <rect x="60"  y="152" width="30" height="18" rx="3" fill="#eee" stroke="#888"/>
    <rect x="94"  y="152" width="40" height="18" rx="3" fill="#eee" stroke="#888"/>
    <rect x="138" y="152" width="30" height="18" rx="3" fill="#eee" stroke="#888"/>
    <text x="75"  y="165" font-size="9.5" fill="#333" text-anchor="middle">prog</text>
    <text x="114" y="165" font-size="9.5" fill="#333" text-anchor="middle">pitch&#183;dur</text>
    <text x="153" y="165" font-size="9.5" fill="#333" text-anchor="middle">EOS</text>
  </g>
  <text x="180" y="165" font-size="10" fill="#666">CP tokens (&#8804; cp slots)</text>
  <line x1="114" y1="176" x2="114" y2="196" stroke="#333" marker-end="url(#arr)"/>
  <rect x="58" y="198" width="112" height="24" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="114" y="214" font-size="11" fill="#111" text-anchor="middle">local encoder</text>
  <line x1="114" y1="222" x2="114" y2="242" stroke="#333" marker-end="url(#arr)"/>
  <rect x="102" y="244" width="24" height="14" rx="3" fill="#3565b0"/>
  <text x="134" y="255" font-size="10" fill="#666">frame embedding</text>

  <!-- interleaved sequence -->
  <line x1="150" y1="262" x2="150" y2="292" stroke="#333" marker-end="url(#arr)"/>
  <text x="160" y="282" font-size="10" fill="#666">interleave (2 positions / step)</text>
  <g>
    <rect x="28"  y="298" width="24" height="20" rx="3" fill="#e6e6e6" stroke="#999"/>
    <rect x="56"  y="298" width="24" height="20" rx="3" fill="#e6e6e6" stroke="#999"/>
    <rect x="84"  y="298" width="24" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="112" y="298" width="24" height="20" rx="3" fill="#f6ddc4" stroke="#c96a1e"/>
    <rect x="140" y="298" width="24" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="168" y="298" width="24" height="20" rx="3" fill="#f6ddc4" stroke="#c96a1e"/>
    <rect x="196" y="298" width="24" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="224" y="298" width="24" height="20" rx="3" fill="#f6ddc4" stroke="#c96a1e"/>
    <rect x="252" y="298" width="24" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="280" y="298" width="24" height="20" rx="3" fill="#f6ddc4" stroke="#c96a1e"/>
    <text x="40"  y="312" font-size="9"  fill="#555" text-anchor="middle">sos</text>
    <text x="68"  y="312" font-size="9"  fill="#555" text-anchor="middle">sos</text>
    <text x="96"  y="312" font-size="9.5" fill="#26497f" text-anchor="middle">m0</text>
    <text x="124" y="312" font-size="9.5" fill="#8a4310" text-anchor="middle">c0</text>
    <text x="152" y="312" font-size="9.5" fill="#26497f" text-anchor="middle">m1</text>
    <text x="180" y="312" font-size="9.5" fill="#8a4310" text-anchor="middle">c1</text>
    <text x="208" y="312" font-size="9.5" fill="#26497f" text-anchor="middle">m2</text>
    <text x="236" y="312" font-size="9.5" fill="#8a4310" text-anchor="middle">c2</text>
    <text x="264" y="312" font-size="9.5" fill="#26497f" text-anchor="middle">m3</text>
    <text x="292" y="312" font-size="9.5" fill="#8a4310" text-anchor="middle">c3</text>
  </g>
  <!-- rotary indices -->
  <text x="20"  y="336" font-size="9.5" fill="#666">RoPE</text>
  <text x="40"  y="336" font-size="9.5" fill="#333" text-anchor="middle"> </text>
  <g font-size="9.5" fill="#333">
    <text x="40"  y="350" text-anchor="middle">0</text>
    <text x="68"  y="350" text-anchor="middle">1</text>
    <text x="96"  y="350" text-anchor="middle">2</text>
    <text x="124" y="350" text-anchor="middle">3</text>
    <text x="152" y="350" text-anchor="middle">4</text>
    <text x="180" y="350" text-anchor="middle">5</text>
    <text x="208" y="350" text-anchor="middle">6</text>
    <text x="236" y="350" text-anchor="middle">7</text>
    <text x="264" y="350" text-anchor="middle">8</text>
    <text x="292" y="350" text-anchor="middle">9</text>
  </g>
  <text x="20" y="380" font-size="10" fill="#666">each stream keeps a private history;</text>
  <text x="20" y="393" font-size="10" fill="#666">stream identity via per-stream Q/K/V,</text>
  <text x="20" y="406" font-size="10" fill="#666">not position</text>

  <!-- ================= PANEL (b) ================= -->
  <text x="412" y="30" font-size="14" font-weight="bold" fill="#111">(b) Training: one block-diffusion step</text>

  <!-- output heads -->
  <rect x="452" y="46" width="150" height="26" rx="5" fill="#fff" stroke="#333"/>
  <text x="527" y="63" font-size="11" fill="#111" text-anchor="middle">AR head: next frame</text>
  <rect x="640" y="46" width="176" height="26" rx="5" fill="#fff" stroke="#7a3fa8" stroke-width="1.4"/>
  <text x="728" y="63" font-size="11" fill="#7a3fa8" text-anchor="middle">denoise head: frame T tokens</text>
  <line x1="527" y1="100" x2="527" y2="74" stroke="#333" marker-end="url(#arr)"/>
  <line x1="728" y1="100" x2="728" y2="74" stroke="#7a3fa8" marker-end="url(#arr)"/>

  <!-- global stack -->
  <rect x="432" y="102" width="404" height="120" rx="8" fill="#fafafa" stroke="#333" stroke-width="1.3"/>
  <text x="826" y="218" font-size="11" fill="#333" text-anchor="end">&#215; 12</text>
  <g font-size="10.5">
    <rect x="452" y="116" width="364" height="20" rx="4" fill="#fff" stroke="#888"/>
    <text x="634" y="130" fill="#333" text-anchor="middle">intra-stream attention (causal, same stream)</text>
    <rect x="452" y="140" width="364" height="20" rx="4" fill="#fff" stroke="#888"/>
    <text x="634" y="154" fill="#333" text-anchor="middle">cross-stream attention (&lt; current step)  &#215; &#963;(gate)</text>
    <rect x="452" y="164" width="364" height="20" rx="4" fill="#fff" stroke="#888"/>
    <text x="634" y="178" fill="#333" text-anchor="middle">frame attention (same step, both slots)  &#215; &#963;(gate)</text>
    <rect x="452" y="188" width="364" height="20" rx="4" fill="#fff" stroke="#888"/>
    <text x="634" y="202" fill="#333" text-anchor="middle">MoE feed-forward (4 experts, top-2)</text>
  </g>

  <!-- clean context row -->
  <line x1="600" y1="252" x2="600" y2="224" stroke="#333" marker-end="url(#arr)"/>
  <g>
    <rect x="432" y="256" width="24" height="20" rx="3" fill="#e6e6e6" stroke="#999"/>
    <rect x="460" y="256" width="24" height="20" rx="3" fill="#e6e6e6" stroke="#999"/>
    <rect x="488" y="256" width="24" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="516" y="256" width="24" height="20" rx="3" fill="#f6ddc4" stroke="#c96a1e"/>
    <rect x="544" y="256" width="24" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="572" y="256" width="24" height="20" rx="3" fill="#f6ddc4" stroke="#c96a1e"/>
    <rect x="600" y="256" width="24" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="628" y="256" width="24" height="20" rx="3" fill="#f6ddc4" stroke="#c96a1e"/>
    <text x="444" y="270" font-size="9"   fill="#555" text-anchor="middle">sos</text>
    <text x="472" y="270" font-size="9"   fill="#555" text-anchor="middle">sos</text>
    <text x="500" y="270" font-size="9.5" fill="#26497f" text-anchor="middle">m0</text>
    <text x="528" y="270" font-size="9.5" fill="#8a4310" text-anchor="middle">c0</text>
    <text x="556" y="270" font-size="9.5" fill="#26497f" text-anchor="middle">m1</text>
    <text x="584" y="270" font-size="9.5" fill="#8a4310" text-anchor="middle">c1</text>
    <text x="612" y="270" font-size="9.5" fill="#26497f" text-anchor="middle">m2</text>
    <text x="640" y="270" font-size="9.5" fill="#8a4310" text-anchor="middle">c2</text>
  </g>
  <text x="432" y="296" font-size="10" fill="#666">clean context (teacher-forced ground truth)</text>

  <!-- query slots -->
  <g>
    <rect x="700" y="256" width="24" height="20" rx="3" fill="#ecdff5" stroke="#7a3fa8" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="728" y="256" width="24" height="20" rx="3" fill="#ecdff5" stroke="#7a3fa8" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="712" y="270" font-size="9.5" fill="#7a3fa8" text-anchor="middle">m?</text>
    <text x="740" y="270" font-size="9.5" fill="#7a3fa8" text-anchor="middle">c?</text>
    <circle cx="754" cy="252" r="8" fill="#7a3fa8"/>
    <text x="754" y="255.5" font-size="9" fill="#fff" text-anchor="middle">k</text>
  </g>
  <line x1="726" y1="252" x2="726" y2="224" stroke="#7a3fa8" marker-end="url(#arr)"/>
  <text x="700" y="296" font-size="10" fill="#7a3fa8">query slots: frame T,</text>
  <text x="700" y="309" font-size="10" fill="#7a3fa8">masked at noise level k</text>

  <!-- attention scope arcs -->
  <path d="M 712 280 C 660 336, 540 336, 505 282" fill="none" stroke="#7a3fa8" stroke-width="1.1" marker-end="url(#arr)"/>
  <text x="608" y="350" font-size="10" fill="#7a3fa8" text-anchor="middle">slots attend only frames &lt; T</text>
  <text x="608" y="366" font-size="10" fill="#b33" text-anchor="middle">frames &#8805; T are masked; context rows never see the slots</text>
  <line x1="768" y1="266" x2="802" y2="266" stroke="#b33" stroke-width="1.2"/>
  <line x1="800" y1="259" x2="812" y2="273" stroke="#b33" stroke-width="1.6"/>
  <line x1="812" y1="259" x2="800" y2="273" stroke="#b33" stroke-width="1.6"/>

  <!-- rope note -->
  <text x="432" y="394" font-size="10" fill="#666">slots share frame T&#8217;s rotary phase &#8594; training phase &#8801; decoding phase at every t (no padding)</text>
  <text x="432" y="410" font-size="10" fill="#666">loss = AR (all clean rows) + denoise (slots, random T and k per sample)</text>

  <!-- ================= PANEL (c) ================= -->
  <text x="876" y="30" font-size="14" font-weight="bold" fill="#111">(c) Decoding: seeded refinement per frame</text>

  <!-- committed prefix -->
  <g>
    <rect x="886"  y="256" width="24" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="914"  y="256" width="24" height="20" rx="3" fill="#f6ddc4" stroke="#c96a1e"/>
    <rect x="942"  y="256" width="24" height="20" rx="3" fill="#c7d8f2" stroke="#3565b0"/>
    <rect x="970"  y="256" width="24" height="20" rx="3" fill="#f6ddc4" stroke="#c96a1e"/>
    <rect x="1004" y="256" width="24" height="20" rx="3" fill="#ecdff5" stroke="#7a3fa8" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="1032" y="256" width="24" height="20" rx="3" fill="#ecdff5" stroke="#7a3fa8" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="898"  y="270" font-size="9.5" fill="#26497f" text-anchor="middle">m</text>
    <text x="926"  y="270" font-size="9.5" fill="#8a4310" text-anchor="middle">c</text>
    <text x="954"  y="270" font-size="9.5" fill="#26497f" text-anchor="middle">m</text>
    <text x="982"  y="270" font-size="9.5" fill="#8a4310" text-anchor="middle">c</text>
    <text x="1018" y="270" font-size="9.5" fill="#7a3fa8" text-anchor="middle">m?</text>
    <text x="1046" y="270" font-size="9.5" fill="#7a3fa8" text-anchor="middle">c?</text>
  </g>
  <text x="886"  y="296" font-size="10" fill="#666">committed prefix (self-generated)</text>
  <text x="1030" y="248" font-size="10" fill="#7a3fa8" text-anchor="middle">frame t</text>

  <!-- loop -->
  <rect x="896" y="66" width="132" height="26" rx="5" fill="#fff" stroke="#333"/>
  <text x="962" y="83" font-size="11" fill="#111" text-anchor="middle">seed from AR head</text>
  <rect x="1064" y="66" width="156" height="40" rx="5" fill="#fff" stroke="#7a3fa8" stroke-width="1.4"/>
  <text x="1142" y="82"  font-size="11" fill="#7a3fa8" text-anchor="middle">refine &#215; K rounds</text>
  <text x="1142" y="96"  font-size="10" fill="#7a3fa8" text-anchor="middle">k = K &#8594; 0, self-conditioned</text>
  <line x1="1028" y1="79" x2="1060" y2="79" stroke="#333" marker-end="url(#arr)"/>
  <!-- each slot re-reads the other slot's previous estimate -->
  <path d="M 1104 106 C 1084 136, 1200 136, 1180 106" fill="none" stroke="#7a3fa8" stroke-width="1.1" marker-end="url(#arr)"/>
  <text x="1142" y="148" font-size="10" fill="#7a3fa8" text-anchor="middle">slots read each other&#8217;s last estimate</text>

  <!-- commit + advance -->
  <line x1="1142" y1="160" x2="1142" y2="184" stroke="#333" marker-end="url(#arr)"/>
  <rect x="1076" y="186" width="132" height="24" rx="5" fill="#fff" stroke="#333"/>
  <text x="1142" y="202" font-size="11" fill="#111" text-anchor="middle">commit frame t</text>
  <line x1="1142" y1="210" x2="1142" y2="244" stroke="#333" stroke-width="1"/>
  <line x1="1142" y1="244" x2="1058" y2="253" stroke="#333" marker-end="url(#arr)"/>
  <path d="M 1076 198 C 940 210, 930 150, 946 96" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="902" y="176" font-size="10" fill="#888">t &#8594; t+1</text>

  <text x="876" y="340" font-size="10" fill="#666">within a frame, exposure bias is closed by construction:</text>
  <text x="876" y="353" font-size="10" fill="#666">the slots condition on their own estimates (as in training</text>
  <text x="876" y="366" font-size="10" fill="#666">via self-conditioning), not on ground truth</text>

  <!-- ============ legend ============ -->
  <g font-size="10.5">
    <rect x="20" y="432" width="16" height="13" rx="2" fill="#c7d8f2" stroke="#3565b0"/>
    <text x="42" y="443" fill="#333">melody frame</text>
    <rect x="126" y="432" width="16" height="13" rx="2" fill="#f6ddc4" stroke="#c96a1e"/>
    <text x="148" y="443" fill="#333">chord frame</text>
    <rect x="228" y="432" width="16" height="13" rx="2" fill="#e6e6e6" stroke="#999"/>
    <text x="250" y="443" fill="#333">SOS</text>
    <rect x="290" y="432" width="16" height="13" rx="2" fill="#ecdff5" stroke="#7a3fa8" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="312" y="443" fill="#333">diffusion query slot (noise level k)</text>
    <rect x="512" y="432" width="16" height="13" rx="2" fill="none" stroke="#c96a1e" stroke-dasharray="3 3"/>
    <text x="534" y="443" fill="#333">empty frame (sparse stream)</text>
  </g>
</svg>
